<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Access Our Portfolio | Cover Page Agency</title>
<style>
:root{--ink:#0e0e0e;--paper:#f7f4ef;--line:#d9d3c8;--mute:#6b665d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:460px}
h1{font-weight:400;font-size:clamp(28px,8vw,40px);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px;line-height:1.1}
p.lead{color:var(--mute);margin:0 0 24px;font-size:16px;line-height:1.5}
label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:16px 0 6px}
input,select{width:100%;padding:14px;border:1px solid var(--line);background:#fff;font:16px Georgia,serif;border-radius:0;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13px;color:var(--mute);line-height:1.45}
.consent input{width:auto;margin-top:3px}
button{margin-top:22px;width:100%;padding:16px;background:var(--ink);color:#fff;border:0;font:14px Georgia,serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
button[disabled]{opacity:.5;cursor:wait}
#msg{margin-top:16px;font-size:15px;line-height:1.5}
#msg.err{color:#a3281f}
#msg.ok{color:#1d5c2e}
.ts{margin-top:18px}
a{color:inherit}
</style>
</head>
<body>
<main>
<h1 id="t">Access our <span id="what">portfolio</span></h1>
<p class="lead">Leave your details and we will email you the private link. Real enquiries only.</p>
<form id="f" novalidate>
<label for="name">Full name</label>
<input id="name" name="name" autocomplete="name" required>
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
<label for="phone">Phone with country code</label>
<input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+971 50 000 0000" required>
<label for="src">How did you hear about us</label>
<select id="src" name="src" required>
<option value="">Select</option>
<option>Google search</option>
<option>Instagram</option>
<option>Recommendation from a friend</option>
<option>Wedding planner or venue</option>
<option>Previous client</option>
<option>AI assistant (ChatGPT, Gemini, other)</option>
<option>Other</option>
</select>
<div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
<div class="consent"><input id="ok" type="checkbox" required><label for="ok" style="text-transform:none;letter-spacing:0;font-size:13px;margin:0">I agree that Cover Page Agency stores these details to reply to my enquiry and send me the link. See the <a href="https://www.coverpageagency.com/privacy-policy" target="_blank" rel="noopener">privacy policy</a>.</label></div>
<div class="ts"><div class="cf-turnstile" id="ts" data-sitekey="TURNSTILE_SITE_KEY" data-appearance="interaction-only"></div></div>
<button id="b" type="submit">Send me the link</button>
<div id="msg" role="status" aria-live="polite"></div>
</form>
</main>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
(function(){
var ENDPOINT="https://script.google.com/macros/s/AKfycbxssFHs5eKxbF8XyMZ5bNplCU_KqQr4b6f-jahIzotrkC2JoqfVYLLTQqM994H8uC3ntg/exec";
var q=new URLSearchParams(location.search);
var to=(q.get("to")||"portfolio").toLowerCase()==="brief"?"brief":"portfolio";
document.getElementById("what").textContent=to;
document.title="Access our "+to+" | Cover Page Agency";
var t0=Date.now(),f=document.getElementById("f"),msg=document.getElementById("msg"),b=document.getElementById("b");
function say(t,c){msg.textContent=t;msg.className=c||""}
f.addEventListener("submit",function(e){
e.preventDefault();
var d={name:f.name.value.trim(),email:f.email.value.trim(),phone:f.phone.value.trim(),src:f.src.value,website:f.website.value,consent:document.getElementById("ok").checked,to:to,ms:Date.now()-t0,lang:document.documentElement.lang,token:(window.turnstile&&turnstile.getResponse())||""};
if(d.name.length<2)return say("Please enter your full name.","err");
if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(d.email))return say("Please enter a valid email.","err");
if(d.phone.replace(/\D/g,"").length<8)return say("Please enter your phone with country code.","err");
if(!d.src)return say("Please tell us how you heard about us.","err");
if(!d.consent)return say("Please accept the privacy note.","err");
b.disabled=true;say("Checking...");
fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)})
.then(function(r){return r.json()})
.then(function(r){
if(r&&r.ok){f.reset();say("Thank you. Check your inbox for your private link. If you do not see it in a few minutes, check spam.","ok");}
else{b.disabled=false;say((r&&r.error)||"Something went wrong. Please try again.","err");if(window.turnstile)turnstile.reset()}
}).catch(function(){b.disabled=false;say("Network error. Please try again.","err")});
});
})();
</script>
</body>
</html>
